<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Background foliage gradient -->
    <radialGradient id="foliage" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="35%" stop-color="#22c55e" />
      <stop offset="70%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </radialGradient>
    
    <!-- Tree trunk gradient -->
    <linearGradient id="bark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Skin gradients -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="50%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#9a3412" stop-opacity="0.4" />
    </linearGradient>

    <!-- Hair gradient -->
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Shirt gradient -->
    <linearGradient id="blackShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="40%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background: Tree & Foliage -->
  <rect width="800" height="1000" fill="url(#foliage)" />

  <!-- Tree trunk behind Zahid -->
  <path d="M 460 0 Q 420 300 480 700 Q 520 900 560 1000 L 760 1000 L 700 0 Z" fill="url(#bark)" opacity="0.95" />
  <!-- Bark texture details -->
  <path d="M 490 50 Q 470 250 510 500" stroke="#451a03" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 530 100 Q 500 350 550 700" stroke="#3b1502" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 580 50 Q 560 400 620 900" stroke="#260e02" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Green leaf clusters -->
  <circle cx="150" cy="120" r="90" fill="#86efac" opacity="0.6" filter="url(#softGlow)" />
  <circle cx="280" cy="80" r="70" fill="#4ade80" opacity="0.7" />
  <circle cx="100" cy="260" r="110" fill="#22c55e" opacity="0.6" />
  <circle cx="200" cy="320" r="80" fill="#86efac" opacity="0.5" />
  <circle cx="680" cy="160" r="100" fill="#86efac" opacity="0.6" />
  <circle cx="720" cy="340" r="90" fill="#4ade80" opacity="0.6" />

  <!-- Small leaves -->
  <path d="M 120,180 Q 90,210 130,230 Q 150,200 120,180 Z" fill="#86efac" />
  <path d="M 220,140 Q 200,180 240,190 Q 250,150 220,140 Z" fill="#4ade80" />
  <path d="M 640,120 Q 610,150 650,170 Q 670,140 640,120 Z" fill="#bbf7d0" />

  <!-- SHOULDERS & BLACK SHIRT -->
  <!-- Body/Torso -->
  <path d="M 120 780 C 140 700 230 650 310 640 L 490 640 C 570 650 660 700 680 780 L 720 1000 L 80 1000 Z" fill="url(#blackShirt)" />
  
  <!-- Shirt collar -->
  <path d="M 310 640 L 370 760 L 400 780 L 430 760 L 490 640 L 430 650 L 400 720 L 370 650 Z" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
  <!-- Left collar wing -->
  <path d="M 310 640 L 350 750 L 390 730 L 370 645 Z" fill="#27272a" />
  <!-- Right collar wing -->
  <path d="M 490 640 L 450 750 L 410 730 L 430 645 Z" fill="#27272a" />
  <!-- Shirt button placket -->
  <line x1="400" y1="780" x2="400" y2="1000" stroke="#27272a" stroke-width="4" />
  <circle cx="400" cy="830" r="5" fill="#a1a1aa" />
  <circle cx="400" cy="910" r="5" fill="#a1a1aa" />

  <!-- NECK -->
  <path d="M 345 520 L 345 670 Q 400 710 455 670 L 455 520 Z" fill="url(#skin)" />
  <!-- Neck shadow under chin -->
  <path d="M 345 520 Q 400 580 455 520 L 455 560 Q 400 620 345 560 Z" fill="url(#skinShadow)" />

  <!-- HEAD & FACE -->
  <!-- Head shape: handsome oval with defined jaw -->
  <path d="M 280 340 C 275 220 525 220 520 340 C 520 440 500 540 400 560 C 300 540 280 440 280 340 Z" fill="url(#skin)" />

  <!-- Ears -->
  <path d="M 275 370 Q 255 410 278 445 Z" fill="#fdba74" />
  <path d="M 525 370 Q 545 410 522 445 Z" fill="#fdba74" />

  <!-- HAIR (Wavy, curly short dark hair from photo) -->
  <path d="M 280 320 
           C 260 270 280 180 350 160 
           C 400 145 480 150 515 200 
           C 545 240 540 310 525 350 
           C 515 310 495 240 450 240 
           C 410 240 380 270 340 250 
           C 310 240 295 280 280 320 Z" fill="url(#hair)" />
  <!-- Hair curls on forehead -->
  <path d="M 340 220 Q 360 250 380 230 Q 370 270 350 260 Z" fill="#18181b" />
  <path d="M 380 220 Q 410 260 425 235 Q 430 280 395 270 Z" fill="#09090b" />
  <path d="M 430 225 Q 460 260 475 240 Z" fill="#18181b" />

  <!-- EYEBROWS (Neat, handsome dark masculine brows) -->
  <path d="M 315 350 Q 355 338 375 352" stroke="#18181b" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M 485 350 Q 445 338 425 352" stroke="#18181b" stroke-width="7" stroke-linecap="round" fill="none" />

  <!-- EYES (Warm, expressive deep brown almond eyes) -->
  <!-- Left Eye -->
  <ellipse cx="348" cy="380" rx="22" ry="13" fill="#ffffff" />
  <circle cx="350" cy="380" r="11" fill="#451a03" />
  <circle cx="350" cy="380" r="6" fill="#09090b" />
  <circle cx="353" cy="377" r="3" fill="#ffffff" />
  <path d="M 324 378 Q 350 365 372 378" stroke="#18181b" stroke-width="3" fill="none" />

  <!-- Right Eye -->
  <ellipse cx="452" cy="380" rx="22" ry="13" fill="#ffffff" />
  <circle cx="450" cy="380" r="11" fill="#451a03" />
  <circle cx="450" cy="380" r="6" fill="#09090b" />
  <circle cx="453" cy="377" r="3" fill="#ffffff" />
  <path d="M 428 378 Q 450 365 476 378" stroke="#18181b" stroke-width="3" fill="none" />

  <!-- NOSE -->
  <path d="M 398 370 L 395 440 Q 380 455 390 465 Q 400 470 410 465 Q 420 455 405 440 L 402 370" stroke="#ea580c" stroke-width="2" fill="#fb923c" opacity="0.6" stroke-linecap="round" />

  <!-- MUSTACHE (Slight, neat trim from photo) -->
  <path d="M 370 495 Q 400 488 430 495 Q 400 502 370 495 Z" fill="#18181b" opacity="0.85" />

  <!-- MOUTH / LIPS -->
  <path d="M 365 510 Q 400 500 435 510 Q 400 535 365 510 Z" fill="#e11d48" opacity="0.75" />
  <line x1="368" y1="510" x2="432" y2="510" stroke="#881337" stroke-width="2" />

  <!-- GOATEE / BEARD (Neat trimmed short beard along chin and jawline) -->
  <path d="M 330 460 Q 340 525 375 550 Q 400 562 425 550 Q 460 525 470 460 Q 450 540 400 555 Q 350 540 330 460 Z" fill="#18181b" opacity="0.88" />
  <!-- Under lip soul patch -->
  <ellipse cx="400" cy="528" rx="7" ry="5" fill="#18181b" opacity="0.8" />
</svg>
